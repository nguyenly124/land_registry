<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Hướng dẫn đăng nhập</title>
    <!-- <script src="https://cdn.tailwindcss.com"></script> -->
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        min-height: 100vh;
        background: #f3f6fa;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .container {
        background: #fff;
        border-radius: 18px;
        box-shadow: 0 4px 24px 0 rgba(30,64,175,0.10), 0 1.5px 6px 0 rgba(30,64,175,0.08);
        padding: 2.5rem 2rem 2rem 2rem;
        max-width: 480px;
        width: 100%;
        text-align: center;
      }
      h1 {
        color: #1E40AF;
        margin-bottom: 1.5rem;
        font-size: 2.2rem;
        font-weight: bold;
        letter-spacing: 1px;
      }
      ol {
        margin: 0 auto;
        padding: 0 0 0 1.5rem;
        text-align: left;
        font-size: 1.1rem;
        color: #222;
      }
      li {
        margin-bottom: 1.1em;
        line-height: 1.6;
      }
      @media (max-width: 600px) {
        .container {
          padding: 1.2rem 0.5rem;
        }
        h1 {
          font-size: 1.3rem;
        }
        ol {
          font-size: 1rem;
        }
      }
    </style>
  </head>

  <body>
    <div class="container">
      <h1>Hướng dẫn<br>đăng nhập hệ thống</h1>
      <ol>
        <li>Nhấn nút <b>Đăng nhập</b> trên trang chủ.</li>
        <li>Nhập số CMND/CCCD và mật khẩu đã đăng ký.</li>
        <li>Nhấn nút <b>Đăng nhập</b> để truy cập hệ thống.</li>
        <li>Nếu thông tin hợp lệ, bạn sẽ được chuyển đến trang chính.</li>
        <li>Nếu quên mật khẩu, hãy liên hệ quản trị viên để được hỗ trợ cấp lại.</li>
      </ol>
    </div>
  </body>
</html>
